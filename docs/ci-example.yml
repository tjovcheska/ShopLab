# EXAMPLE ONLY — not an active workflow. GitHub only runs workflows in
# .github/workflows/; this file lives in docs/ on purpose. Students build
# their own CI. Copy it to .github/workflows/smoke.yml to try it.
#
# It starts both ShopLab environments with Docker Compose, waits until their
# health endpoints answer, runs the instructor smoke test against both, and
# prints the container logs if anything fails.

name: ShopLab smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Start ShopLab (ports 3000 and 3001)
        run: docker compose up -d --build

      - name: Wait for both environments to be healthy
        run: |
          for url in http://localhost:3000 http://localhost:3001; do
            echo "Waiting for $url/api/test/health ..."
            for i in $(seq 1 60); do
              if curl -fsS "$url/api/test/health" | grep -q '"ok"'; then
                echo "$url is up"
                break
              fi
              if [ "$i" = 60 ]; then
                echo "$url did not become healthy in time" >&2
                exit 1
              fi
              sleep 2
            done
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the smoke test and its browser
        working-directory: smoke
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run the smoke test against both environments
        working-directory: smoke
        env:
          CI: "true"
        run: npx playwright test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke/playwright-report
          retention-days: 7

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Stop ShopLab
        if: always()
        run: docker compose down
